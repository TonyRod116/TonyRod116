<svg xmlns="http://www.w3.org/2000/svg" width="600" height="270" viewBox="0 0 600 270" role="img" aria-labelledby="title desc">
  <title id="title">Good ideas deserve to get built.</title>
  <desc id="desc">An amber sun with compass rays over street-level buildings. I love AI. I build things with it.</desc>
  <rect width="600" height="270" rx="16" fill="#192b2b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="35" fill="#edb65c" font-size="12" font-weight="700" letter-spacing="2">PRODUCT / CODE / AI</text>
    <text x="26" y="91" fill="#f6efe3" font-size="38" font-weight="700" letter-spacing="-1.2">Good ideas deserve</text>
    <text x="26" y="135" fill="#f6efe3" font-size="38" font-weight="700" letter-spacing="-1.2">to get built<tspan fill="#edb65c">.</tspan></text>
    <text x="28" y="190" fill="#c7d3cc" font-size="18">I love AI.</text>
    <text x="28" y="211" fill="#c7d3cc" font-size="18">I build things with it.</text>
  </g>
