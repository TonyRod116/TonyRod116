  <title id="title">Good ideas deserve to get built.</title>
  <desc id="desc">An amber sun and geometric buildings on a deep green background.</desc>
  <rect width="600" height="270" rx="16" fill="#192b2b"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="28" y="35" fill="#edb65c" font-size="12" font-weight="700" letter-spacing="2">PRODUCT / CODE / CURIOSITY</text>
    <text x="26" y="91" fill="#f6efe3" font-size="38" font-weight="700" letter-spacing="-1.2">Good ideas deserve</text>
    <text x="26" y="135" fill="#f6efe3" font-size="38" font-weight="700" letter-spacing="-1.2">to get built<tspan fill="#edb65c">.</tspan></text>
    <text x="28" y="190" fill="#c7d3cc" font-size="14">From renovation tools</text>
    <text x="28" y="211" fill="#c7d3cc" font-size="14">to a seat in the sun.</text>
  </g>
